display_information:
  name: Payflows Watchdog
  description: Relance au bon moment pour que les circuits Payflows ne restent jamais bloqués.
  background_color: "#1f2a44"
features:
  bot_user:
    display_name: Payflows Watchdog
    always_online: true
oauth_config:
  scopes:
    bot:
      - incoming-webhook
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
